[project]
name = "dexra-langgraph-agent"
version = "0.1.0"
description = "A LangGraph agent that trades on Solana, with Dexra checking every buy. Dry run by default."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "solders>=0.29.0",
    "langgraph==1.2.16",
    "langchain[mcp]==1.4.6",
    "langchain-core==1.6.12",
    "langchain-anthropic==1.7.6",
    "langchain-openai==1.7.2",
]

[project.scripts]
dexra-graph = "dexra_agent.cli:graph_main"
dexra-agent = "dexra_agent.cli:agent_main"

[dependency-groups]
dev = [
    "mypy>=1",
    "pytest>=9.1",
    "respx>=0.23",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexra_core", "dexra_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["dexra_core"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "dexra_core", "dexra_agent", "whitelist_gate"]

[tool.mypy]
python_version = "3.11"
files = ["dexra_agent"]
